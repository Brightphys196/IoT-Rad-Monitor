<header class="main-header glass-panel">

            <span data-i18n="logo_text">Trạm Quan Trắc IoT</span>
        </a>
        <button id="mobile-nav-toggle" class="mobile-nav-toggle" aria-label="Mở menu" aria-expanded="false">

            <span class="hamburger-line"></span>

        <div class="nav-container">

            </nav>

                    <select id="language-switcher" title="Select Language" data-i18n-title="language_switcher_title">

                </div>
                <button id="sound-toggle" type="button" title="Bật/Tắt âm thanh cảnh báo">

                <button id="login-btn" class="header-action-btn" data-i18n="login_button" style="display: none;">Đăng
