<!DOCTYPE html>
<html lang="vi" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Cấu hình Favicon & PWA -->
    <link rel="apple-touch-icon" sizes="180x180" href="../images/apple-icon-180x180.png">
    <link rel="icon" type="image/png" sizes="192x192" href="../images/android-icon-192x192.png">
    <link rel="icon" type="image/png" sizes="32x32" href="../images/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../images/favicon-16x16.png">
    <link rel="manifest" href="../manifest.json">
    <meta name="msapplication-TileColor" content="#ffffff">
    <meta name="msapplication-TileImage" content="../ms-icon-144x144.png">
    <meta name="theme-color" content="#ffffff">

    <title>Bảng điều khiển - Giám Sát IoT</title>
    <link rel="stylesheet" href="../assets/css/dashboard.css">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cal-heatmap@4.0.0/dist/cal-heatmap.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <!-- ✨ [MỚI] Script bảo vệ trang, yêu cầu đăng nhập -->
    <!-- <script src="../assets/js/auth-protect.js"></script> -->
</head>

<body>
    <div id="header-placeholder"></div>

    <main class="page-container" role="main">

        <!-- ✨ [TÁI CẤU TRÚC] Bố cục chính được chia thành hai cột: thông tin trạm và biểu đồ -->
        <div class="dashboard-layout">
            <div id="live-status-cards-container" class="live-status-column scrollable-cards animate-on-scroll">
                <!-- Các thẻ thông tin của trạm sẽ được tạo và chèn vào đây từ template -->
            </div>
            <section class="chart-container fixed-chart glass-panel animate-on-scroll" data-animation-delay="200">
                <div class="main-chart-header">
                    <h2>Lịch sử Phóng xạ (µSv/h)</h2>
                    <div class="global-chart-actions">
                        <button id="btn-pause-resume" title="Tạm dừng cập nhật">
                            <svg class="icon-pause" xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                                viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                                stroke-linecap="round" stroke-linejoin="round">
                                <rect x="6" y="4" width="4" height="16"></rect>
                                <rect x="14" y="4" width="4" height="16"></rect>
                            </svg>
                            <svg class="icon-play" xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                                viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                                stroke-linecap="round" stroke-linejoin="round">
                                <polygon points="5 3 19 12 5 21 5 3"></polygon>
                            </svg>
                        </button>
                        <button id="btn-download" title="Tải xuống dữ liệu">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
                                stroke-linejoin="round">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                                <polyline points="7 10 12 15 17 10" />
                                <line x1="12" x2="12" y1="15" y2="3" />
                            </svg>
                        </button>
                        <button id="btn-fullscreen" title="Xem toàn màn hình">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
                                stroke-linejoin="round">
                                <path
                                    d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3" />
                            </svg>
                        </button>
                        <button id="btn-reset-zoom" title="Đặt lại thu phóng">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
                                stroke-linejoin="round">
                                <path
                                    d="M12 4V1m0 22v-3m8-8h3M1 12h3m16.24-8.24l2.12-2.12M4.76 19.24l-2.12 2.12M19.24 19.24l2.12 2.12M4.76 4.76l-2.12-2.12" />
                            </svg>
                        </button>
                    </div>
                </div>
                <div class="global-filter-buttons">
                    <button data-view="live" class="active">Trực tiếp</button>
                    <button data-view="1d">1 Ngày</button>
                    <button data-view="5d">5 Ngày</button>
                    <button data-view="1m">1 Tháng</button>
                    <button data-view="6m">6 Tháng</button>
                    <button data-view="1y">1 Năm</button>
                </div>
                <div class="main-chart-wrapper">
                    <div class="chart-wrapper">
                        <canvas id="rad-chart"></canvas>
                        <div class="loading-overlay">
                            <div class="spinner"></div>
                        </div>
                    </div>
                </div>
            </section>

        </div>

        <div id="error-message" class="error-hidden"></div>
        <div id="toast-container"></div>
    </main>
    <div id="footer-placeholder"></div>

    <!-- ✨ [TÁI CẤU TRÚC] Bản mẫu đã được cập nhật theo giao diện mới -->
    <template id="station-card-template">
        <div class="station-card glass-panel shadow-hover">
            <header class="station-header">
                <h2 class="station-title">Trạm Quan Trắc __STATION_NUM__</h2>
                <div class="station-status">
                    <span class="header-metrics">
                        <span class="header-temp">T: --°C</span>
                        <span class="separator">-</span>
                        <span class="header-humi">H: --%</span>
                    </span>
                    <span class="separator">|</span>
                    <span class="status-indicator online"></span>
                    <span class="last-updated">Đang chờ...</span>
                </div>
            </header>
            <div class="live-values-container">
                <div class="value-card radiation main-metric-card">
                    <div class="card-header">
                        <span class="card-icon radiation"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                                viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round">
                                <path d="M12 12h.01" />
                                <path d="M12 2a10 10 0 1 1-10 10" />
                                <path d="M19.07 4.93a10 10 0 0 0-14.14 0" />
                                <path d="M4.93 19.07a10 10 0 0 0 14.14 0" />
                            </svg></span>
                        <h2 class="main-metric-label">Phóng xạ</h2>
                        <span class="status usv-status">--</span>
                    </div>
                    <span class="value main-metric-value" style="cursor:pointer" title="Nhấn để chuyển đổi giá trị">--
                        µSv/h</span>
                    <div class="sub-values">
                        <div class="sub-value-item">
                            <span class="sub-value-label">CPS</span>
                            <span class="sub-value cps-value">--</span>
                        </div>
                        <div class="sub-value-item">
                            <span class="sub-value-label">Counts</span>
                            <span class="sub-value counts-value">--</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <script src="https://cdn.jsdelivr.net/npm/chart.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns/dist/chartjs-adapter-date-fns.bundle.min.js"
        defer></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom/dist/chartjs-plugin-zoom.min.js" defer></script>

    <script src="../assets/js/i18n.js"></script>
    <script src="../assets/js/toast.js" defer></script>
    <script src="../assets/js/main.js" defer></script>
    <script src="../assets/js/script.js" defer></script>
    <script src="../assets/js/dashboard-3d.js" defer></script>
</body>

</html>
