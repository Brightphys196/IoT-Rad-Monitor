<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- ✨ [MỚI] Cấu hình Favicon & PWA -->
    <link rel="apple-touch-icon" sizes="57x57" href="../images/apple-icon-57x57.png">
    <link rel="apple-touch-icon" sizes="60x60" href="../images/apple-icon-60x60.png">
    <link rel="apple-touch-icon" sizes="72x72" href="../images/apple-icon-72x72.png">
    <link rel="apple-touch-icon" sizes="76x76" href="../images/apple-icon-76x76.png">
    <link rel="apple-touch-icon" sizes="114x114" href="../images/apple-icon-114x114.png">
    <link rel="apple-touch-icon" sizes="120x120" href="../images/apple-icon-120x120.png">
    <link rel="apple-touch-icon" sizes="144x144" href="../images/apple-icon-144x144.png">
    <link rel="apple-touch-icon" sizes="152x152" href="../images/apple-icon-152x152.png">
    <link rel="apple-touch-icon" sizes="180x180" href="../images/apple-icon-180x180.png">
    <link rel="icon" type="image/png" sizes="192x192"  href="../images/android-icon-192x192.png">
    <link rel="icon" type="image/png" sizes="32x32" href="../images/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="96x96" href="../images/favicon-96x96.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../images/favicon-16x16.png">
    <link rel="manifest" href="/manifest.json">
    <meta name="msapplication-TileColor" content="#ffffff">
    <meta name="msapplication-TileImage" content="/ms-icon-144x144.png">
    <meta name="theme-color" content="#ffffff">

    <title>Bảng điều khiển - Giám Sát IoT</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Tải font với display=swap để không chặn render -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap">
    <!-- Tải CSS cho heatmap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cal-heatmap@4.2.2/dist/cal-heatmap.css">
    <!-- ✨ [SỬA LỖI] Thêm thư viện Font Awesome để hiển thị icon trên toast -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>

<body>
    <div id="header-placeholder"></div>

    <div class="dashboard-grid">

        <div class="live-status-container">
            
           <div class="station-card" id="station-01">
                <header class="station-header">
                    <h2>Trạm Quan Trắc 01</h2>
                    <div class="station-status">
                        <span class="status-indicator"></span>
                        <span id="last-updated-01">Đang chờ...</span>
                    </div>
                </header>
               <div class="live-values-container">
                    <div class="value-card temperature">
                       <div class="card-header"><span class="card-icon temperature"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4v10.54a4 4 0 1 1-4 0V4a2 2 0 0 1 4 0Z"/></svg></span><h2>Nhiệt độ</h2><span class="status" id="temp-status-01">--</span></div>
                        <span class="value" id="temp-value-01">-- °C</span>
                    </div>
                    <div class="value-card humidity">
                       <div class="card-header"><span class="card-icon humidity"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z"/></svg></span><h2>Độ ẩm</h2><span class="status" id="humi-status-01">--</span></div>
                        <span class="value" id="humi-value-01">-- %</span>
                    </div>
                    <div class="value-card radiation">
                       <div class="card-header"><span class="card-icon radiation"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 12h.01"/><path d="M12 2a10 10 0 1 1-10 10"/><path d="M19.07 4.93a10 10 0 0 0-14.14 0"/><path d="M4.93 19.07a10 10 0 0 0 14.14 0"/></svg></span><h2>Phóng xạ</h2><span class="status" id="usv-status-01">--</span></div>
                        <span class="value" id="usv-value-01">-- µSv/h</span>
                    </div>
                </div>
            </div>

            <div class="station-card" id="station-02">
                <header class="station-header">
                    <h2>Trạm Quan Trắc 02</h2>
                    <div class="station-status">
                        <span class="status-indicator"></span>
                        <span id="last-updated-02">Đang chờ...</span>
                    </div>
                </header>
                <div class="live-values-container">
                    <div class="value-card temperature">
                        <div class="card-header"><span class="card-icon temperature"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4v10.54a4 4 0 1 1-4 0V4a2 2 0 0 1 4 0Z"/></svg></span><h2>Nhiệt độ</h2><span class="status" id="temp-status-02">--</span></div>
                        <span class="value" id="temp-value-02">-- °C</span>
                    </div>
                    <div class="value-card humidity">
                        <div class="card-header"><span class="card-icon humidity"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z"/></svg></span><h2>Độ ẩm</h2><span class="status" id="humi-status-02">--</span></div>
                        <span class="value" id="humi-value-02">-- %</span>
                    </div>
                    <div class="value-card radiation">
                        <div class="card-header"><span class="card-icon radiation"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 12h.01"/><path d="M12 2a10 10 0 1 1-10 10"/><path d="M19.07 4.93a10 10 0 0 0-14.14 0"/><path d="M4.93 19.07a10 10 0 0 0 14.14 0"/></svg></span><h2>Phóng xạ</h2><span class="status" id="usv-status-02">--</span></div>
                        <span class="value" id="usv-value-02">-- µSv/h</span>
                    </div>
                </div>
            </div>

        </div>

        <section class="chart-container">
             <div class="main-chart-header">
                <h2>So sánh Lịch sử Dữ liệu</h2>
                <div class="global-chart-actions">
                    <button id="btn-pause-resume" title="Tạm dừng cập nhật">
                        <svg class="icon-pause" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>
                        <svg class="icon-play" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                    </button>
                    <button id="btn-download" title="Tải xuống dữ liệu">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
                    </button>
                    <button id="btn-fullscreen" title="Xem toàn màn hình">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
                    </button>
                    <button id="btn-reset-zoom" title="Đặt lại thu phóng">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4V1m0 22v-3m8-8h3M1 12h3m16.24-8.24l2.12-2.12M4.76 19.24l-2.12 2.12M19.24 19.24l2.12 2.12M4.76 4.76l-2.12-2.12"/></svg>
                    </button>
                </div>
            </div>
            
            <div class="global-filter-buttons">
                <button data-view="live" class="active">Trực tiếp</button>
                <button data-view="1d">1 Ngày</button>
                <button data-view="5d">5 Ngày</button>
                <button data-view="1m">1 Tháng</button>
                <button data-view="6m">6 Tháng</button>
                <button data-view="1y">1 Năm</button>
            </div>

            <div class="chart-grid">
                <div class="chart-group">
                    <h4>Nhiệt độ (°C)</h4>
                    <div class="chart-wrapper">
                        <canvas id="temp-chart"></canvas>
                        <div class="loading-overlay"><div class="spinner"></div></div>
                    </div>
                </div>
                <div class="chart-group">
                    <h4>Độ ẩm (%)</h4>
                    <div class="chart-wrapper">
                        <canvas id="humi-chart"></canvas>
                        <div class="loading-overlay"><div class="spinner"></div></div>
                    </div>
                </div>
                <div class="chart-group">
                    <h4>Phóng xạ (µSv/h)</h4>
                    <div class="chart-wrapper">
                        <canvas id="rad-chart"></canvas>
                        <div class="loading-overlay"><div class="spinner"></div></div>
                    </div>
                </div>
            </div>
        </section>

    </div>

    <div id="error-message" class="error-hidden"></div>
    <div id="toast-container"></div>
    <div id="footer-placeholder"></div>
  
    <script src="https://cdn.jsdelivr.net/npm/chart.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns/dist/chartjs-adapter-date-fns.bundle.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom/dist/chartjs-plugin-zoom.min.js" defer></script>

    <script src="../assets/js/i18n.js"></script>
    <script src="../assets/js/toast.js" defer></script>
    <script src="../assets/js/main.js" defer></script>
    <script src="../assets/js/script.js" defer></script>
</body>
</html>
